dontChroot: false
timeout: 120
script:
  - command: "/usr/share/canvas/greeter/install-greeter"
  - command: "pacman-key --init && pacman-key --populate archlinux cachyos"
  - command: "systemctl enable bluetooth.service power-profiles-daemon.service cups.service"
  - command: "for d in /boot/efi /efi /boot; do if [ -d $d/EFI/Microsoft ]; then printf '0.0 0 0.0\\n0\\nLOCAL\\n' > /etc/adjtime; fi; done; true"
i18n:
  name: "Setting up CanOS..."
