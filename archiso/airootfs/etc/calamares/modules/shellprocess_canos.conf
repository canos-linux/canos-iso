dontChroot: false
timeout: 120
script:
  - command: "/usr/share/canvas/greeter/install-greeter"
  - command: "pacman-key --init && pacman-key --populate archlinux cachyos"
  - command: "systemctl enable bluetooth.service || true"
  - command: "systemctl enable power-profiles-daemon.service || true"
  - command: "systemctl enable cups.service || true"
  - command: "test -d /boot/efi/EFI/Microsoft && printf '0.0 0 0.0\\n0\\nLOCAL\\n' > /etc/adjtime || true"
  - command: "test -d /efi/EFI/Microsoft && printf '0.0 0 0.0\\n0\\nLOCAL\\n' > /etc/adjtime || true"
i18n:
  name: "Setting up CanOS..."
